name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"
          use-public-rspm: true

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libuv1-dev

      - name: Install packages
        run: |
          Rscript -e 'install.packages(c("shiny","bslib","plotly","DT","readxl","jsonlite","digest","testthat","styler","lintr"), repos="https://packagemanager.posit.co/cran/latest")'

      - name: Reconstruct and verify
        run: |
          Rscript scripts/run_analysis.R

      - name: Fail on verification regression
        run: |
          Rscript -e 'r <- jsonlite::read_json("verification/report.json", simplifyVector = TRUE); s <- r$entries$status; if (any(s == "FAIL")) stop(paste("Verifikasi gagal:", paste(r$entries$metric[s == "FAIL"], collapse = ", "))); cat("OK", length(s), "metrik\n")'

      - name: Tests
        run: |
          Rscript tests/testthat.R

      - name: Style check
        run: |
          Rscript -e 'out <- styler::style_dir(".", exclude_dirs = c("data","www","private","analysis")); if (any(out$changed)) { print(out[out$changed, c("file","changed")]); stop("Jalankan styler") }'

  docker-build:
    runs-on: ubuntu-latest
    needs: r-quality
    steps:
      - uses: actions/checkout@v7
      - name: Build image without publishing
        run: |
          docker build --build-arg APP_VERSION=ci -t inar:ci .
